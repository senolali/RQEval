# ──────────────────────────────────────────────────────────
# DATASETS
# num_samples: controls how many examples to use from each.
# Remove any dataset block to exclude it from evaluation.
# ──────────────────────────────────────────────────────────
datasets:

  - name: "synthetic"
    type: "synthetic"
    params:
      num_reasoning: 100      # ← change this to use more/fewer examples
      num_adversarial: 75     # ← change this to use more/fewer examples
      num_robustness: 75      # ← change this to use more/fewer examples
      seed: 42

  - name: "gsm8k"
    type: "gsm8k"
    params:
      num_samples: 250        # ← change this to use more/fewer examples
      seed: 42

  - name: "strategyqa"
    type: "strategyqa"
    params:
      num_samples: 250        # ← change this to use more/fewer examples
      seed: 42

  - name: "mmlu"
    type: "mmlu"
    params:
      num_samples: 225        # 25 items x 9 reasoning subjects
      seed: 42
      # Optionally restrict to specific subjects:
      # subjects:
      #   - "formal_logic"
      #   - "logical_fallacies"
      #   - "high_school_mathematics"

  # ── Example: How to add your own JSON dataset ───────────
  # - name: "my_dataset"
  #   type: "json"
  #   params:
  #     path: "data/my_questions.json"
  #     num_samples: 100      # uses all if not set
  #     seed: 42

# ──────────────────────────────────────────────────────────
# METRICS
# ──────────────────────────────────────────────────────────
metrics:
  consistency_runs: 3           # K runs per question for CS metric
  robustness_perturbations: 3   # P perturbations per question for RS metric
  stability_runs: 3             # K runs per question for SS metric
  nli_model: "cross-encoder/nli-deberta-v3-small"
  bertscore_model: "distilbert-base-uncased"

# ──────────────────────────────────────────────────────────
# AGGREGATION STRATEGIES
# Add as many custom strategies as you want.
# Weights are auto-normalized if they don't sum to 1.0.
# All strategies appear as separate columns in Excel output.
# ──────────────────────────────────────────────────────────
aggregation:
  strategies:

    balanced:
      correctness:      0.1667
      consistency:      0.1667
      robustness:       0.1667
      logical_coherence: 0.1667
      efficiency:       0.1667
      stability:        0.1667

    safety_priority:
      correctness:      0.30
      consistency:      0.05
      robustness:       0.30
      logical_coherence: 0.25
      efficiency:       0.05
      stability:        0.05

    accuracy_priority:
      correctness:      0.50
      consistency:      0.10
      robustness:       0.15
      logical_coherence: 0.15
      efficiency:       0.05
      stability:        0.05

    efficiency_priority:
      correctness:      0.20
      consistency:      0.15
      robustness:       0.15
      logical_coherence: 0.10
      efficiency:       0.30
      stability:        0.10

    medical_triage:
      correctness:      0.40
      consistency:      0.05
      robustness:       0.30
      logical_coherence: 0.20
      efficiency:       0.03
      stability:        0.02

    legal_compliance:
      correctness:      0.15
      consistency:      0.25
      robustness:       0.20
      logical_coherence: 0.35
      efficiency:       0.03
      stability:        0.02

    edge_device:
      correctness:      0.30
      consistency:      0.03
      robustness:       0.10
      logical_coherence: 0.05
      efficiency:       0.50
      stability:        0.02

    # ── Example: add your own custom strategy ─────────────
    # my_custom_strategy:
    #   correctness:       0.50
    #   robustness:        0.30
    #   logical_coherence: 0.20
    #   consistency:       0.00
    #   efficiency:        0.00
