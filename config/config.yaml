# ============================================================
# LLM Reasoning Quality Evaluation Framework
# Main Configuration File
#
# HOW TO ADD A NEW MODEL (no code needed):
#   - type: "openai"    → any OpenAI-compatible API
#   - type: "anthropic" → Claude models
#   - type: "gemini"    → Google Gemini models
#   - type: "deepseek"  → DeepSeek models
#   - type: "local"     → any HuggingFace model
#   - type: "mock"      → testing without APIs
#
# HOW TO ADD A NEW DATASET (no code needed):
#   - type: "synthetic"  → auto-generated
#   - type: "gsm8k"      → math reasoning
#   - type: "strategyqa" → commonsense yes/no
#   - type: "mmlu"       → multi-subject multiple choice
#   - type: "json"       → your own JSON file
#   Set num_samples to control how many examples to use.
#
# HOW TO ADD A NEW AGGREGATION STRATEGY (no code needed):
#   Add a new block under aggregation.strategies
#   Weights must sum to 1.0
# ============================================================

experiment:
  name: "RQEval"
  seed: 42
  deterministic: false
  output_dir: "outputs"
  verbose: true

# ──────────────────────────────────────────────────────────
# MODELS
# API keys are read from environment variables or .env file.
# Copy .env.example → .env and fill in your keys.
# Models with missing API keys are automatically skipped.
# ──────────────────────────────────────────────────────────
# Parallel evaluation workers for API models (top-level — this is what the
# evaluator actually reads; per-model params max_workers is ignored).
# Local models are always forced to 1 worker.
max_workers: 8

models:

  # ══════════════════════════════════════════════════════════
  # ACTIVE PANEL — paper model panel, rerun via ASU CreateAI
  # gateway where available.
  #   type: "asu" → ASU CreateAI /query REST endpoint
  #   Token: env var ASU_CREATEAI_TOKEN  (Bearer, service token)
  #   Base URL: env var ASU_BASE_URL (default api-main-poc);
  #             set to https://api-main.aiml.asu.edu if your
  #             project runs on the main environment.
  # DeepSeek is NOT on CreateAI → queried via DeepSeek API.
  # Qwen2.5-1.5B and Phi-2 are local HuggingFace models (as in paper).
  # ══════════════════════════════════════════════════════════

  - name: "GPT-4o-mini"
    type: "asu"
    params:
      model_name: "gpt4o_mini"        # CreateAI model key
      model_provider: "openai"
      api_key_env: "ASU_CREATEAI_TOKEN"
      max_tokens: 256
      max_retries: 5
      timeout: 120
      temperature: 0.7
      request_delay: 1.0
      max_workers: 8

  - name: "Claude-Haiku-4.5"
    type: "asu"
    params:
      model_name: "claude4_5_haiku"   # marked "Experimental" on CreateAI
      model_provider: "aws"
      api_key_env: "ASU_CREATEAI_TOKEN"
      max_tokens: 256
      max_retries: 5
      timeout: 120
      temperature: 0.7
      request_delay: 1.0
      max_workers: 8

  - name: "Gemini-2.5-Flash"
    type: "asu"
    params:
      model_name: "geminiflash2_5"
      model_provider: "gcp-deepmind"
      api_key_env: "ASU_CREATEAI_TOKEN"
      max_tokens: 1024
      max_retries: 5
      timeout: 120
      temperature: 0.7
      request_delay: 1.0
      max_workers: 8

  # NOTE: CreateAI "llama3-70b" resolves to meta.llama3-1-70b-instruct
  # (Llama 3.1-70B). Previous runs used llama-3.3-70b via OpenRouter.
  # Keep ASU version only if you also update the paper's model table;
  # otherwise re-enable the OpenRouter block below instead.
  - name: "LLaMA-3.1-70B"
    type: "asu"
    params:
      model_name: "llama3-70b"        # Llama 3.1-70B, "Experimental"
      model_provider: "aws"
      api_key_env: "ASU_CREATEAI_TOKEN"
      max_tokens: 256
      max_retries: 5
      timeout: 120
      temperature: 0.7
      request_delay: 1.0
      max_workers: 8

  - name: "DeepSeek-V3"
    type: "deepseek"                  # not on CreateAI → direct API
    params:
      model_id: "deepseek-chat"
      api_key_env: "DEEPSEEK_API_KEY"
      base_url: "https://api.deepseek.com"
      max_tokens: 256
      max_retries: 5
      timeout: 60
      temperature: 0.7
      request_delay: 1.0
      max_workers: 8

  - name: "Qwen2.5-1.5B"
    type: "local"                     # queried separately (local HF), as in paper
    params:
      model_id: "Qwen/Qwen2.5-1.5B-Instruct"
      device: "cuda"                  # or "cpu"
      use_4bit: false
      max_new_tokens: 256
      trust_remote_code: true
      temperature: 0.7
      max_workers: 1

