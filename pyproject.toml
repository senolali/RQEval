[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqeval"
version = "2.0.2"
description = "RQEval: A multi-dimensional behavioral framework for evaluating LLM reasoning quality beyond accuracy"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Ali Şenol", email = "alisenol@tarsus.edu.tr" },
    { name = "Garima Agrawal", email = "garima@humaconn.com" },
    { name = "Huan Liu", email = "huanliu@asu.edu" },
]
keywords = [
    "llm", "evaluation", "reasoning", "nlp",
    "large-language-models", "benchmarking",
    "consistency", "robustness", "logical-coherence", "rqeval"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.5.0",
    "datasets>=2.14.0",
    "sentence-transformers>=2.2.0",
    "bert-score>=0.3.13",
    "openpyxl>=3.1.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
local = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "accelerate>=0.20.0",
    "bitsandbytes>=0.41.0",
    "sentencepiece>=0.1.99",
]
viz = [
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
perturbation = [
    "nltk>=3.8",
    "spacy>=3.7",
    "lemminflect>=0.2.3",
    "tiktoken>=0.7.0",
]
all = ["rqeval[local,viz,perturbation]"]

[project.scripts]
rqeval = "rqeval.cli:main"

[project.urls]
Homepage      = "https://github.com/senolali/RQEval"
Repository    = "https://github.com/senolali/RQEval"
"Bug Tracker" = "https://github.com/senolali/RQEval/issues"
Paper         = "https://arxiv.org/abs/2605.24661"
PyPI          = "https://pypi.org/project/rqeval/"

[tool.setuptools.packages.find]
where   = ["."]
include = ["rqeval*", "metrics*", "models*",
           "llm_datasets*", "evaluation*", "visualization*", "utils*"]

[tool.setuptools.package-data]
"rqeval" = ["_data/**/*", "_data/*"]
